# Deploy helpers for a Lovable-hosted app.
#
# The main QA app is published on Lovable (https://content-migratio-qa.lovable.app).
# Lovable syncs with this GitHub repo — push to main → appears in Lovable;
# publish from Lovable when you want the live snapshot updated.
#
# This workflow only auto-builds the Phase 2 render-service image (Playwright)
# and pushes it to GitHub Container Registry. It does not replace Lovable hosting.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "render-service/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-render
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-render-service:
    name: Build & push render-service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/migration-qa-render" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./render-service
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
