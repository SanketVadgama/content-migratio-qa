# Continuous integration — runs on every push and pull request.
# Does not deploy. Fails the check if install, lint, or build breaks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Build
        run: bun run build
        env:
          # Public Supabase vars (safe for client bundle). Set in repo Secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # Optional Phase 2 — only needed if the build reads them
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          RENDER_SERVICE_TOKEN: ${{ secrets.RENDER_SERVICE_TOKEN }}
